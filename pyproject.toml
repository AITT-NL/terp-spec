# terp-spec — the contracts Terp's programs read, as an installable distribution
# (ADR 0082).
#
# The package is DATA: the schemas more than one program reads (the deployment,
# workbench and layout declarations, the finding and check-report formats, the
# assurance profile and the conversation stream) and their fixtures. Consumers
# depend on it as a declared dependency instead of a repo-relative path. The
# version IS the contracts version (VERSION), deliberately independent of the
# framework's lockstep release version. The rule catalog and its corpus are the
# framework's own and ship with its checkers (terp-framework ADR 0203).
#
# Layer-neutral by design: no dependencies, no terp.* imports (the same
# isolation discipline as Studio and the runner keep).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terp-spec"
version = "0.44.0"
description = "The contracts Terp's programs read: the deployment, workbench and layout declarations, the finding and check-report formats, the assurance profile and the conversation stream."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]
# CI-only, and never a runtime dependency of the published distribution: the
# thing actually exposed in this repository is the release pipeline, which
# publishes to two registries from a job holding `id-token: write`. zizmor
# audits those workflows. Declared here rather than installed ad hoc in CI so
# the version is pinnable, reviewable and visible to dependabot.
lint = ["zizmor>=1.30"]

# The accessor package plus the data itself: a built wheel carries the data
# inside `terp_spec/`, while an editable/workspace install reads it from the
# directory the package sits in — `terp_spec.spec_dir()` handles both layouts.
[tool.hatch.build.targets.wheel]
packages = ["terp_spec"]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "terp_spec/VERSION"
"findings.schema.json" = "terp_spec/findings.schema.json"
"app-check-report.schema.json" = "terp_spec/app-check-report.schema.json"
"assurance-profile.schema.json" = "terp_spec/assurance-profile.schema.json"
"layout-declaration.schema.json" = "terp_spec/layout-declaration.schema.json"
"deployment-declaration.schema.json" = "terp_spec/deployment-declaration.schema.json"
"deployment-declaration.fixtures.json" = "terp_spec/deployment-declaration.fixtures.json"
"workbench-declaration.schema.json" = "terp_spec/workbench-declaration.schema.json"
"workbench-declaration.fixtures.json" = "terp_spec/workbench-declaration.fixtures.json"
"conversation-events.schema.json" = "terp_spec/conversation-events.schema.json"
"conversation-events.fixtures.json" = "terp_spec/conversation-events.fixtures.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
