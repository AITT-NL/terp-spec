name: ci

# The contracts' own CI (ADR 0082): plain data + a tiny accessor with zero
# dependencies. The `standard` job (the name branch protection knows) proves them
# self-consistent: versioning agreement, packaging manifests that carry every
# artifact, each schema well-formed and its fixtures reading as they say.
#
# No job checks out another repository. The rules, their corpus and the checks
# that hold them live in terp-framework (its ADR 0203), so nothing here waits on a
# reference implementation, and nothing there waits on this repository except its
# own pin of a published release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest
      - name: Test (the contracts are self-consistent)
        run: python -m pytest

  # This repository holds OIDC publishing rights to two registries that feed the
  # framework's gate -- and therefore every consumer's. The same checks and the
  # same posture the framework runs on itself.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: zizmor — GitHub Actions workflow hygiene
        env:
          # Online mode adds the audits that need the API (known-vulnerable
          # actions). Both publish jobs here hold `id-token: write` for PyPI and
          # npm, so an action in this pipeline is a third party running code
          # with that reach.
          GH_TOKEN: ${{ github.token }}
        run: uv run --group lint zizmor .github/workflows

      - name: gitleaks — secrets anywhere in the git history
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner
